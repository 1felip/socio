name: Evals

# eval:quick em todo PR; suíte completa manual (workflow_dispatch) e toda segunda 09:00 UTC.
# Chaves em Secrets (ANTHROPIC_API_KEY, OPENAI_API_KEY, GOOGLE_GENERATIVE_AI_API_KEY);
# IDs de modelo em Variables (MODEL_ORCHESTRATOR, MODEL_FAST, MODEL_VISION, MODEL_JUDGE, ...).
# Sem chave configurada (fork, PR de bot), o job avisa e passa sem rodar.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: "Suíte (all, reviews, analyst, injection, menu)"
        default: all
        type: choice
        options: [all, reviews, analyst, injection, menu]
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

env:
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
  MODEL_ORCHESTRATOR: ${{ vars.MODEL_ORCHESTRATOR }}
  MODEL_FAST: ${{ vars.MODEL_FAST }}
  MODEL_VISION: ${{ vars.MODEL_VISION }}
  MODEL_AUDIO: ${{ vars.MODEL_AUDIO }}
  MODEL_JUDGE: ${{ vars.MODEL_JUDGE }}
  MODEL_EMBED: ${{ vars.MODEL_EMBED }}
  EVAL_COST_LIMIT_USD: ${{ vars.EVAL_COST_LIMIT_USD || '5' }}

jobs:
  quick:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: keys
        run: |
          if [ -z "$MODEL_ORCHESTRATOR" ] || { [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$OPENAI_API_KEY" ] && [ -z "$GOOGLE_GENERATIVE_AI_API_KEY" ]; }; then
            echo "::notice::Sem chaves/modelos configurados: eval:quick não roda neste PR."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.keys.outputs.run == 'true'
        run: pnpm eval:quick
      - if: always() && steps.keys.outputs.run == 'true'
        run: cat evals/reports/*.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - if: always() && steps.keys.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-quick-reports
          path: evals/reports/*.md
          if-no-files-found: ignore

  full:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: keys
        run: |
          if [ -z "$MODEL_ORCHESTRATOR" ] || { [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$OPENAI_API_KEY" ] && [ -z "$GOOGLE_GENERATIVE_AI_API_KEY" ]; }; then
            echo "::error::Configure as chaves (Secrets) e os MODEL_* (Variables) do repositório."
            exit 1
          fi
      # supabase/seed.sql não é versionado: o eval do Analista precisa dele.
      - run: pnpm seed
      - id: suite
        run: echo "name=${{ github.event.inputs.suite || 'all' }}" >> "$GITHUB_OUTPUT"
      - if: steps.suite.outputs.name == 'all' || steps.suite.outputs.name == 'injection'
        run: pnpm eval:injection
      - if: (success() || failure()) && (steps.suite.outputs.name == 'all' || steps.suite.outputs.name == 'reviews')
        run: pnpm eval:reviews
      - if: (success() || failure()) && (steps.suite.outputs.name == 'all' || steps.suite.outputs.name == 'analyst')
        run: pnpm eval:analyst
      # Fotos de cardápio ficam fora do git: no CI o eval:menu só avisa que não há casos.
      - if: (success() || failure()) && (steps.suite.outputs.name == 'all' || steps.suite.outputs.name == 'menu')
        run: pnpm eval:menu
      - if: always()
        run: cat evals/reports/*.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports-${{ github.run_id }}
          path: evals/reports/*.md
          if-no-files-found: ignore
          retention-days: 90
